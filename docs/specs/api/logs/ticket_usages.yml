openapi: 3.1.0
info:
  title: Ticket Usages Logs API
  description: 整理券・チケット利用（通過）時のタイムスタンプログデータ（CSV形式）を取得するAPI。
  version: 1.0.0

paths:
  /api/logs/ticket-usages:
    get:
      tags:
        - Logs
      summary: チケット利用ログの取得
      operationId: getTicketUsagesLogs
      parameters:
        - name: admin_id
          in: query
          required: true
          description: 管理者ID（主にCloudflareのsub）。認証を兼ねる。
          schema:
            type: string
        - name: start_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 取得開始日時（ISO 8601形式）
        - name: end_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 取得終了日時（ISO 8601形式）
      responses:
        '200':
          description: 利用日時のタイムスタンプ一覧CSVデータ。
          content:
            text/csv:
              schema:
                type: string
                description: |
                  CSVフォーマット:
                  timestamp
                  2026-09-10T09:00:00Z
              examples:
                default:
                  value: |-
                    timestamp
                    2026-09-10T09:00:00Z
                    2026-09-10T09:01:23Z
        '400':
          description: 不正なリクエスト、またはログ情報の取得失敗。
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                default:
                  value:
                    message: "Unable to fetch logs."
