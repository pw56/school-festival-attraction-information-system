openapi: 3.1.0
info:
  title: Queue Group Logs API
  description: 待機列のグループの情報のログデータ（CSV形式）を取得するAPI。
  version: 1.0.0

paths:
  /api/logs/queue-group:
    get:
      tags:
        - Logs
      summary: 待機列のグループのログの取得
      operationId: getQueueGroupLogs
      parameters:
        - name: admin_id
          in: query
          required: true
          description: 管理者ID（主にCloudflareのsub）。認証を兼ねる。
          schema:
            type: string
        - name: start_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 取得開始日時（ISO 8601形式）
        - name: end_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 取得終了日時（ISO 8601形式）
      responses:
        '200':
          description: タイムスタンプとグループ人数の配列（JSON形式の文字列）を含むCSVデータ。
          content:
            text/csv:
              schema:
                type: string
                description: |
                  CSVフォーマット:
                  timestamp,queue_group_counts
                  2026-09-10T09:00:00Z,"[4,2,1,3]"
              examples:
                default:
                  value: |-
                    timestamp,queue_group_counts
                    2026-09-10T09:00:00Z,"[4,2,1,3]"
                    2026-09-10T09:05:00Z,"[2,1,5]"
        '400':
          description: 不正なリクエスト、またはログ情報の取得失敗。
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                default:
                  value:
                    message: "Unable to fetch logs."
