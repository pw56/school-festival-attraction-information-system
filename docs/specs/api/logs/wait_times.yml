openapi: 3.1.0
info:
  title: Wait Times Logs API
  description: 待ち時間情報（分単位）のログデータ（CSV形式）を取得するAPI。
  version: 1.0.0

paths:
  /api/logs/wait-times:
    get:
      tags:
        - Logs
      summary: 待ち時間ログの取得
      operationId: getWaitTimesLogs
      parameters:
        - name: start_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 取得開始日時（ISO 8601形式）
        - name: end_at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: 取得終了日時（ISO 8601形式）
      responses:
        '200':
          description: タイムスタンプと待ち時間（分単位）のCSVデータ。
          content:
            text/csv:
              schema:
                type: string
                description: |
                  CSVフォーマット:
                  timestamp,wait_time_minutes
                  2026-09-10T09:00:00Z,15
              examples:
                default:
                  value: |-
                    timestamp,wait_time_minutes
                    2026-09-10T09:00:00Z,15
                    2026-09-10T09:05:00Z,20
        '400':
          description: 不正なリクエスト、またはログ情報の取得失敗。
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                default:
                  value:
                    message: "Unable to fetch logs."
