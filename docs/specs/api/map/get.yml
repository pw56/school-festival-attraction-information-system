openapi: 3.1.0
info:
  title: Get Map
  description: 3Dマップ情報を取得するAPI。
  version: 1.0.0
paths:
  /api/map:
    get:
      tags:
        - Map
      summary: マップ情報取得
      operationId: getMap
      responses:
        '200':
          description: マップデータ。
          content:
            application/json:
              schema:
                $ref: 'https://example.com/schemas/map.json'
        '400':
          description: 不正なリクエスト、またはマップ情報の取得失敗。
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
