openapi: 3.1.0
info:
  title: Tickets API
  version: 1.0.0
  description: チケットの予約、認証、譲渡に関するAPI
paths:
  /api/tickets/reserve:
    post:
      openapi: 3.1.0
      info:
        title: reserve
        description: 指定した出し物の整理券を取得するAPI。
        version: 1.0.0
      paths:
        /api/tickets/reserve:
          post:
            tags:
              - Tickets
            operationId: reserveTicket
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      event_id:
                        $ref: https://example.com/schemas/ticket.json#/properties/event_id
                      ticket_slot:
                        $ref: https://example.com/schemas/ticket.json#/properties/ticket_slot
                      auth_type:
                        $ref: https://example.com/schemas/ticket.json#/properties/auth_type
                      fcmToken:
                        type: string
                        description: プッシュ通知に使用されるFCMトークン。
                    required:
                      - event_id
                      - ticket_slot
                      - auth_type
            responses:
              '200':
                description: チケットの取得成功。
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        ticket:
                          $ref: https://example.com/schemas/ticket.json
                        message:
                          type: string
                      required:
                        - ticket
                        - message
                      examples:
                        - ticket:
                            ticket_id: 5f2d28d2-5d18-21e8-f32b-dafb0a67babb
                            event_id: event-123
                            ticket_slot:
                              start_time: 2026-08-01T15:00:00 09:00
                              end_time: 2026-08-01T15:30:00 09:00
                            auth_info: JBSWY3DPEHPK3PXP
                          message: Ticket reserved successfully.
              '400':
                description: |
                  不正なリクエスト。
                  主にCLI等でAPIを直接叩いた場合を想定。
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        message:
                          type: string
                      examples:
                        - message: Invalid ticket slots.
              '409':
                description: |
                  指定された枠にチケットが既に予約されている場合。
                  主にCLI等でAPIを直接叩いた場合を想定。
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        message:
                          type: string
                      examples:
                        - message: User already has a ticket in this time slot.
  /api/tickets/cancel:
    post:
      openapi: 3.1.0
      info:
        title: cancel
        description: 指定した出し物の整理券を取得するAPI。
        version: 1.0.0
      paths:
        /api/tickets/cancel:
          post:
            tags:
              - Tickets
            operationId: cancelTicket
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      ticket_id:
                        $ref: https://example.com/schemas/ticket.json#/properties/ticket_id
                      auth_code:
                        type: string
                        description: 認証に使用する認証コード（TOTPワンタイムコードまたはトークン）。
                    required:
                      - ticket_id
                      - auth_code
            responses:
              '200':
                description: キャンセル成功。
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        message:
                          type: string
                      examples:
                        - message: Ticket cancelled successfully.
              '400':
                description: チケットが存在しないか、ユーザーが不一致の場合など。
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        message:
                          type: string
                      examples:
                        - message: Ticket not found or user mismatch.
  /api/tickets/authenticate:
    post:
      openapi: 3.1.0
      info:
        title: authenticate
        description: 整理券を使用するAPI。
        version: 1.0.0
      paths:
        /api/tickets/authenticate:
          post:
            tags:
              - Tickets
            operationId: authenticateTicket
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      ticket_id:
                        $ref: https://example.com/schemas/ticket.json#/properties/ticket_id
                      auth_code:
                        type: string
                        description: 認証に使用する認証コード（TOTPワンタイムコードまたはトークン）。
                    required:
                      - ticket_id
                      - auth_code
            responses:
              '200':
                description: 認証成功。
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        message:
                          type: string
                      examples:
                        - message: Ticket authenticated successfully.
              '400':
                description: チケットが存在しないか、ユーザーが不一致の場合など。
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        message:
                          type: string
                      examples:
                        - message: Ticket not found or user mismatch.
  /api/tickets/transfer:
    post:
      openapi: 3.1.0
      info:
        title: transfer
        description: 整理券の譲渡時にFCMトークンを更新するAPI。
        version: 1.0.0
      paths:
        /api/tickets/transfer:
          post:
            tags:
              - Tickets
            operationId: transferTicket
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      ticket_id:
                        $ref: https://example.com/schemas/ticket.json#/properties/ticket_id
                      fcmToken:
                        type: string
                        description: プッシュ通知に使用されるFCMトークン。
                    required:
                      - ticket_id
                      - fcmToken
            responses:
              '200':
                description: 譲渡成功。
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        message:
                          type: string
                      examples:
                        - message: Ticket transferred successfully.
              '400':
                description: チケットが存在しないか、不正なリクエストの場合。
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        message:
                          type: string
                      examples:
                        - message: Ticket not found or invalid request.
components: {}
