openapi: 3.1.0
info:
  title: System Settings API
  version: 1.0.0
  description: システム全体の共通設定やイベントIDの管理API
paths:
  /api/system/settings:
    openapi: 3.1.0
    info:
      title: System Settings API
      description: システム全体（文化祭全体）の設定を取得・更新するAPI（管理者向けAPI群）。
      version: 1.0.0
    paths:
      /api/system-settings:
        get:
          tags:
            - SystemSettings
          summary: システム全体設定の取得
          operationId: getSystemSettings
          responses:
            '200':
              description: システム全体の設定情報。
              content:
                application/json:
                  schema:
                    $ref: ./schema.yml
                  examples:
                    default:
                      value:
                        location_restriction:
                          enabled: true
                          session_timeout_minutes: 30
                          allowed_radius_meters: 100
                        operating_hours:
                          start_time: 2026-09-20T09:00:00 09:00
                          end_time: 2026-09-20T17:00:00 09:00
                        restrict_access_to_operating_hours: true
                        allowed_ticket_delay_minutes: 15
                        prevent_duplicate_event_reservations_before_use: true
                        bot_protection_enabled: true
            '400':
              description: 設定情報の取得失敗。
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      message:
                        type: string
                  examples:
                    default:
                      value:
                        message: Unable to fetch system settings.
        put:
          tags:
            - System
          summary: システム全体設定の更新
          operationId: updateSystemSettings
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - admin_id
                  properties:
                    admin_id:
                      type: string
                      description: 管理者ID（主にCloudflareのsub）。認証を兼ねる。
                    settings:
                      $ref: ./schema.yml
          responses:
            '200':
              description: 更新後のシステム全体設定情報。
              content:
                application/json:
                  schema:
                    $ref: ./schema.yml
            '400':
              description: 不正なリクエスト、または更新失敗。
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      message:
                        type: string
                  examples:
                    default:
                      value:
                        message: Invalid settings or update failed.
  /api/system/event-ids:
    openapi: 3.1.0
    info:
      title: Admin Event ID Mapping API
      description: 出し物の公開用IDと管理用secret_idの対応情報を取得するAPI（運営向けAPI群）。
      version: 1.0.0
    paths:
      /api/events/mappings:
        get:
          tags:
            - System
          summary: 出し物IDマッピング情報の取得
          operationId: getEventIdMappings
          parameters:
            - name: admin_id
              in: query
              required: true
              description: 管理者ID（主にCloudflareのsub）。認証を兼ねる。
              schema:
                type: string
          responses:
            '200':
              description: 公開用IDとsecret_idの対マップ。
              content:
                application/json:
                  schema:
                    $ref: ./schema.yml
                  examples:
                    default:
                      value:
                        a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11: sec_8f7b2c1a
                        b1ffcd00-1d2e-3f4g-5h6i-7jj8kk99ll00: sec_3d4e5f6g
            '400':
              description: マッピング情報の取得失敗。
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      message:
                        type: string
                  examples:
                    default:
                      value:
                        message: Unable to fetch event ID mappings.
components: {}
