$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.com/schemas/ticket.json"
title: "TicketReservation"
description: "整理券のスキーマ。"
type: "object"
required:
  - "ticket_id"
  - "event_id"
  - "start_time"
  - "end_time"
additionalProperties: false
properties:
  ticket_id:
    type: "string"
    description: "整理券ID。"
  event_id:
    type: "string"
    description: "対象の出し物ID。"
  start_time:
    type: "string"
    format: "date-time"
    description: "ISO8601形式の開始時刻。"
  end_time:
    type: "string"
    format: "date-time"
    description: "ISO8601形式の終了時刻。"
