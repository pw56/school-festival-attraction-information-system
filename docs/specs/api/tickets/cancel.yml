openapi: 3.1.0
info:
  title: cancel
  description: 指定した出し物の整理券を取得するAPI。
  version: 1.0.0
paths:
  /api/tickets/cancel:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              properties:
                ticket_id:
                  type: string
                  description: キャンセル対象の整理券ID。
              
              required:
                - ticket_id
      responses:
        '200':
          description: キャンセル成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                examples:
                  - message: "Ticket cancelled successfully."
        '400':
          description: チケットが存在しないか、ユーザーが不一致の場合など。
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                examples:
                  - message: "Ticket not found or user mismatch."
