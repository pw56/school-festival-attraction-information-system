openapi: 3.1.0
info:
  title: authenticate
  description: 整理券を使用するAPI。
  version: 1.0.0
paths:
  /api/tickets/authenticate:
    post:
      tags:
        - Tickets
      operationId: authenticateTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              properties:
                ticket_id:
                  $ref: "https://example.com/schemas/ticket.json#/properties/ticket_id"
                auth_code:
                  type: string
                  description: 認証に使用する認証コード（TOTPワンタイムコードまたはトークン）。

              required:
                - ticket_id
                - auth_code
      responses:
        '200':
          description: 認証成功。
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                examples:
                  - message: "Ticket authenticated successfully."
        '400':
          description: チケットが存在しないか、ユーザーが不一致の場合など。
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                examples:
                  - message: "Ticket not found or user mismatch."
