$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.com/schemas/event.json"
title: "Event"
description: "Schema for deployed event information API payload."
type: "object"
required:
  - "id"
  - "name"
  - "thumbnail_path"
  - "location"
  - "type"
additionalProperties: false
properties:
  id:
    type: "string"
  name:
    type: "string"
    minLength: 1
  thumbnail_path:
    type: "string"
  description:
    type: "string"
  operating_hour_rules:
    $ref: "#/$defs/operatingHourRules"
  duration:
    type: "object"
    required:
      - "duration_seconds"
      - "is_approximate"
      - "margin_seconds"
    additionalProperties: false
    properties:
      duration_seconds:
        type: "integer"
        minimum: 0
      is_approximate:
        type: "boolean"
      margin_seconds:
        type: "integer"
        minimum: 0
  location:
    type: "object"
    required:
      - "lat"
      - "lng"
      - "floor"
    additionalProperties: false
    properties:
      lat:
        type: "number"
        minimum: -90
        maximum: 90
      lng:
        type: "number"
        minimum: -180
        maximum: 180
      floor:
        type: "integer"
  max_party_size:
    type: "integer"
    minimum: 1
  type:
    type: "string"
    enum:
      - "food_and_drink"
      - "vehicles"
      - "fair_stalls"
      - "horror"
      - "riddle_solving"
      - "sports"
      - "entertainment"
      - "product_sales"
      - "workshop"
      - "exhibition"
      - "stage"
      - "rest_area"
      - "information_desk"
      - "restrooms"
      - "stairs"
      - "elevator"
      - "first_aid_room"
      - "parking_lot"
      - "others"
  restrictions:
    type: "string"
  accessibility:
    type: "array"
    uniqueItems: true
    items:
      type: "string"
      enum:
        - "wheelchair_accessible"
        - "step_free_access"
        - "accessible_restroom"
        - "colorblind_friendly"
        - "braille_pamphlet"
        - "audio_guide_available"
        - "subtitled_video"
        - "script_available"
        - "writing_board_available"
        - "visual_instructions"
        - "assistant_dog_allowed"
        - "allergy_labels"
  available_ticket_slots:
    $ref: "#/$defs/availableTicketSlots"

$defs:
  timeString:
    type: "string"
    pattern: "^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$"
  timeInterval:
    type: "array"
    items:
      $ref: "#/$defs/timeString"
    minItems: 2
    maxItems: 2
  operatingHourRules:
    type: "object"
    required:
      - "timezone"
      - "rules"
    additionalProperties: false
    properties:
      timezone:
        type: "string"
      rules:
        type: "array"
        items:
          type: "object"
          required:
            - "condition"
            - "operating_hours"
          additionalProperties: false
          properties:
            condition:
              type: "string"
              enum:
                - "date_range"
                - "day_of_week"
                - "default"
            start_date:
              type: "string"
              format: "date"
            end_date:
              type: "string"
              format: "date"
            target:
              type: "array"
              items:
                type: "string"
                enum:
                  - "mon"
                  - "tue"
                  - "wed"
                  - "thu"
                  - "fri"
                  - "sat"
                  - "sun"
            operating_hours:
              type: "array"
              items:
                $ref: "#/$defs/timeInterval"
          allOf:
            - if:
                properties:
                  condition:
                    const: "date_range"
              then:
                required:
                  - "start_date"
                  - "end_date"
            - if:
                properties:
                  condition:
                    const: "day_of_week"
              then:
                required:
                  - "target"
  availableTicketSlots:
    type: "object"
    required:
      - "timezone"
      - "rules"
    additionalProperties: false
    properties:
      timezone:
        type: "string"
      rules:
        type: "array"
        items:
          type: "object"
          required:
            - "condition"
            - "target_period"
            - "remaining_tickets"
          additionalProperties: false
          properties:
            condition:
              type: "string"
              enum:
                - "date_range"
                - "day_of_week"
                - "default"
            start_date:
              type: "string"
              format: "date"
            end_date:
              type: "string"
              format: "date"
            target:
              type: "array"
              items:
                type: "string"
                enum:
                  - "mon"
                  - "tue"
                  - "wed"
                  - "thu"
                  - "fri"
                  - "sat"
                  - "sun"
            target_period:
              $ref: "#/$defs/timeInterval"
            remaining_tickets:
              type: "integer"
              minimum: 0
          allOf:
            - if:
                properties:
                  condition:
                    const: "date_range"
              then:
                required:
                  - "start_date"
                  - "end_date"
            - if:
                properties:
                  condition:
                    const: "day_of_week"
              then:
                required:
                  - "target"
