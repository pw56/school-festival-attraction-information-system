openapi: 3.1.0
info:
  title: Crowd Level Transmission API
  description: 出し物の混雑具合を送信（更新）するAPI。
  version: 1.0.0
paths:
  /api/events/site-info-transmission/crowd-level:
    post:
      tags:
        - Events
      summary: 混雑具合情報送信
      operationId: transmitCrowdLevels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - secret_id
                - crowd_levels
              additionalProperties: false
              properties:
                secret_id:
                  type: string
                  description: 運営用の出し物ID
                crowd_levels:
                  type: array
                  items:
                    type: object
                    required:
                      - timestamp
                      - crowd_level
                    additionalProperties: false
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: 地域を含むISO8601形式のタイムスタンプ
                      crowd_level:
                        $ref: 'https://example.com/schemas/crowd_levels.json#/properties/crowd_level'
      responses:
        '200':
          description: 送信完了。
        '400':
          description: 不正なリクエスト、またはデータの送信失敗。
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                default:
                  value:
                    message: "Unable to transmit crowd level data."
