openapi: 3.1.0
info:
  title: Queue Group Transmission API
  description: 出し物の待機列グループ情報を送信（更新）するAPI。
  version: 1.0.0
paths:
  /api/events/site-info-transmission/queue-groups:
    post:
      tags:
        - Events
      summary: 待機列グループ情報送信
      operationId: transmitQueueGroups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - secret_id
                - queue_groups
              additionalProperties: false
              properties:
                secret_id:
                  type: string
                  description: 運営用の出し物ID
                queue_groups:
                  type: array
                  items:
                    type: object
                    required:
                      - timestamp
                      - group_counts
                    additionalProperties: false
                    properties:
                      timestamp:
                        type: string
                        format: date-time
                        description: 地域を含むISO8601形式のタイムスタンプ
                      group_counts:
                        $ref: 'https://example.com/schemas/queue_group_counts.json'
      responses:
        '200':
          description: 送信完了。
        '400':
          description: 不正なリクエスト、またはデータの送信失敗。
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                default:
                  value:
                    message: "Unable to transmit queue group data."
