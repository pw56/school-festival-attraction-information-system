openapi: 3.1.0
info:
  title: get
  description: 公開されている出し物（アトラクション）の一覧を取得するAPI。
  version: 1.0.0
paths:
  /api/events/profiles/get:
    get:
      tags:
        - Events
      operationId: getEvents

      responses:
        '200':
          description: 出し物の配列。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'https://example.com/schemas/event.json'
              examples:
                all_events:
                  value:
                    - name: "エキサイティングコースター"
                      thumbnail_path: "/events/thumbnails/exciting_coaster.webp"
                      description: "強烈な振動と急降下が特徴のコースターです。"
                      operating_hour_rules:
                        timezone: "Asia/Tokyo"
                        rules:
                          - condition: "default"
                            operating_hours:
                              - - "10:00"
                                - "18:00"
                      duration:
                        duration_seconds: 180
                        is_approximate: false
                        margin_seconds: 0
                      location:
                        lat: 35.681236
                        lng: 139.767125
                        floor: 1
                      max_party_size: 4
                      type: "vehicles"
                      restrictions: "妊娠中の方は利用をご遠慮ください。"
                      accessibility:
                        - "車椅子非対応"
                      available_ticket_slots:
                        timezone: "Asia/Tokyo"
                        rules:
                          - condition: "default"
                            target_period:
                              - "10:00"
                              - "10:30"
                            remaining_tickets: 15
        '400':
          description: 不正なリクエスト、または出し物情報の取得失敗。
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                default:
                  value:
                    message: "Unable to fetch events."
