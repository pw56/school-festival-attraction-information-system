openapi: 3.1.0
info:
  title: Admin Events API
  description: 出し物登録・設定編集用API（管理者向けAPI群）。
  version: 1.0.0
paths:
  /api/events/profiles/create:
    post:
      tags:
        - AdminEvents
      summary: 出し物新規作成(追加)
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: 'https://example.com/schemas/event.json'
              properties:
                id: false
      responses:
        '201':
          description: 作成したリソース情報。
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret_id:
                    type: string
                  event:
                    $ref: 'https://example.com/schemas/event.json'
  /api/events/profiles/update:
    put:
      tags:
        - AdminEvents
      summary: 出し物更新
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - secret_id
              properties:
                secret_id:
                  type: string
                  description: 管理用ID
              allOf:
                - $ref: 'https://example.com/schemas/event.json'
      responses:
        '200':
          description: 更新済みオブジェクト。
          content:
            application/json:
              schema:
                $ref: 'https://example.com/schemas/event.json'
  /api/events/profiles/delete:
    delete:
      tags:
        - AdminEvents
      summary: 出し物削除
      operationId: deleteEvent
      parameters:
        - name: secret_id
          in: query
          required: true
          schema:
            type: string
          description: 削除対象の管理用ID
      responses:
        '200':
          description: 削除完了。
        '204':
          description: 削除完了 (元から存在しなかった場合)。
